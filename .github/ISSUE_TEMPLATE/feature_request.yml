name: Feature request
description: Suggest a focused improvement to the reading experience.
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What user problem should be solved?
      description: Describe the task and why current behavior is insufficient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the smallest useful change. Avoid prescribing implementation prematurely.
    validations:
      required: true
  - type: textarea
    id: safeguards
    attributes:
      label: Readability, accessibility, and recovery considerations
      description: How should PDF text, selection, annotations, keyboard access, and restore behavior be protected?
