name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  static-build:
    permissions:
      contents: read
    timeout-minutes: 20
    name: Static build · ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        python: ["3.12"]
        node: ["24"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ matrix.node }}
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Verify locale, appearance, and showcase tests
        run: |
          node test-i18n.cjs
          node test-showcase.cjs
          node test-brand.cjs
          node test-release-metadata.cjs
      - name: Create reviewed public build configuration
        shell: pwsh
        run: |
          $config = @{
            homepage_url = "https://lipo1024.github.io/tais-appearance/"
            update_url = "https://raw.githubusercontent.com/LIPO1024/tais-appearance/main/updates.json"
            source_url = "https://github.com/LIPO1024/tais-appearance"
            support_url = "https://github.com/LIPO1024/tais-appearance/issues"
            license_reviewed = $true
            release_approved = $true
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("${{ runner.temp }}/tais-release-config.json", $config, [System.Text.UTF8Encoding]::new($false))
      - name: Build and verify XPI
        run: python build.py --public --config ${{ runner.temp }}/tais-release-config.json --out dist
      - name: Upload reproducible XPI
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: TAIS-Appearance-${{ runner.os }}-${{ github.sha }}
          path: dist/TAIS_Appearance-*.xpi
          if-no-files-found: error
          retention-days: 14
  security-hygiene:
    permissions:
      contents: read
    timeout-minutes: 5
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - name: Check for accidentally committed credentials
        shell: bash
        run: |
          if grep -RInE --exclude-dir=.git --exclude='*.png' --exclude='*.jpg' --exclude='*.pdf' --exclude='*.xpi' '(gh[pousr]_[A-Za-z0-9]{30,}|sk_live_[A-Za-z0-9]+|rk_live_[A-Za-z0-9]+|BEGIN (RSA|OPENSSH|EC) PRIVATE KEY)' .; then
            echo "Potential credential detected."
            exit 1
          fi
      - name: Ensure obsolete payment copy stays out of product surfaces
        shell: bash
        run: |
          if grep -RInE '(GitHub Sponsors|Alipay checkout|One-time US\$1 payment|Unlock all themes|Hosted checkout is not configured)' README* index.html source; then
            echo "Obsolete payment UI or marketing copy detected."
            exit 1
          fi
