name: Release
on:
  push:
    tags:
      - "v2.4.0"
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Build exact release package
        run: python build.py --public --config release-config.json --out dist
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = "dist/TAIS_Appearance-2.4.0.xpi"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  TAIS_Appearance-2.4.0.xpi" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/TAIS_Appearance-2.4.0.xpi dist/SHA256SUMS.txt --title "TAIS Appearance ${{ github.ref_name }}" --generate-notes
