name: Release
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build-release:
    permissions:
      contents: write
    timeout-minutes: 20
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "24"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Create reviewed public build configuration
        shell: pwsh
        run: |
          $config = @{
            homepage_url = "https://lipo1024.github.io/tais-appearance/"
            update_url = "https://raw.githubusercontent.com/LIPO1024/tais-appearance/main/updates.json"
            source_url = "https://github.com/LIPO1024/tais-appearance"
            support_url = "https://github.com/LIPO1024/tais-appearance/issues"
            license_reviewed = $true
            release_approved = $true
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("${{ runner.temp }}/tais-release-config.json", $config, [System.Text.UTF8Encoding]::new($false))
      - name: Build exact release package
        run: python build.py --public --config ${{ runner.temp }}/tais-release-config.json --out dist
      - name: Generate SHA-256 checksum
        id: release-metadata
        shell: pwsh
        run: |
          $manifest = Get-Content source/manifest.json -Raw | ConvertFrom-Json
          if ("${{ github.ref_name }}" -ne "v$($manifest.version)") { throw "Tag does not match manifest version $($manifest.version)" }
          "version=$($manifest.version)" | Out-File -Append -Encoding utf8 $env:GITHUB_OUTPUT
          $file = "dist/TAIS_Appearance-$($manifest.version).xpi"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  TAIS_Appearance-$($manifest.version).xpi" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" 2>$null
          if ($LASTEXITCODE -eq 0) { throw "Release ${{ github.ref_name }} already exists; refusing to overwrite published assets." }
          if ($LASTEXITCODE -ne 1) { throw "Unable to verify existing release state." }
          $file = "dist/TAIS_Appearance-${{ steps.release-metadata.outputs.version }}.xpi"
          gh release create "${{ github.ref_name }}" $file dist/SHA256SUMS.txt --repo "${{ github.repository }}" --title "TAIS Appearance ${{ github.ref_name }}" --generate-notes
