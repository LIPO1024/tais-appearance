name: Release
on:
  push:
    tags:
      - "v2.4.0"
permissions:
  contents: write
jobs:
  build-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Create reviewed public build configuration
        shell: pwsh
        run: |
          $config = @{
            homepage_url = "https://github.com/LIPO1024/tais-appearance"
            update_url = "https://raw.githubusercontent.com/LIPO1024/tais-appearance/main/updates.json"
            source_url = "https://github.com/LIPO1024/tais-appearance"
            support_url = "https://github.com/LIPO1024/tais-appearance/issues"
            license_reviewed = $true
            release_approved = $true
          } | ConvertTo-Json
          [System.IO.File]::WriteAllText("${{ runner.temp }}/tais-release-config.json", $config, [System.Text.UTF8Encoding]::new($false))
      - name: Build exact release package
        run: python build.py --public --config ${{ runner.temp }}/tais-release-config.json --out dist
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $file = "dist/TAIS_Appearance-2.4.0.xpi"
          $hash = (Get-FileHash $file -Algorithm SHA256).Hash.ToLower()
          "$hash  TAIS_Appearance-2.4.0.xpi" | Out-File -Encoding ascii dist/SHA256SUMS.txt
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" dist/TAIS_Appearance-2.4.0.xpi dist/SHA256SUMS.txt --title "TAIS Appearance ${{ github.ref_name }}" --generate-notes
